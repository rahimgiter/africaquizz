services:
  api:
    build:
      context: ./africaquizz-api
      dockerfile: Dockerfile
    image: africaquizz-api
    container_name: aq_api
    restart: unless-stopped
    working_dir: /var/www/
    ports:
      - "8000:8000" # Ajout du port pour tester l'API depuis Windows
    volumes:
      - ./africaquizz-api:/var/www
    networks:
      - africaquizz-network
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: aq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: africaquizz
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - aq-postgres-data:/var/lib/postgresql/data
    networks:
      - africaquizz-network

  redis:
    image: redis:7-alpine
    container_name: aq_redis
    restart: unless-stopped
    volumes:
      - aq-redis-data:/data
    networks:
      - africaquizz-network

networks:
  africaquizz-network:
    driver: bridge

volumes:
  aq-postgres-data:
  aq-redis-data: